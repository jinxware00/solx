name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_commit:
        description: Exact commit to validate for a release
        type: string
        default: ''
      release_tag:
        description: Existing runtime version tag for release preparation
        type: string
        default: ''
      prepare_release:
        description: Prepare verified public assets after all Windows checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_commit || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.99.0'

jobs:
  test:
    name: Rust and extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-solx/package-lock.json
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Validate Windows resource guard
        if: runner.os == 'Windows'
        shell: powershell
        # -File reports the suite outcome; expected negative probes must not
        # leak LASTEXITCODE into the Actions -Command wrapper.
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-guard.ps1
      - name: Test Rust
        run: cargo test --locked
      - name: Check Rust lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install extension dependencies
        working-directory: vscode-solx
        run: npm ci
      - name: Test extension units
        working-directory: vscode-solx
        run: npm test
      - name: Test extension against the real interpreter
        working-directory: vscode-solx
        run: npm run test:interpreter
      - name: Package extension
        working-directory: vscode-solx
        run: npm run package
      - name: Test packaged extension in VS Code 1.85.2
        if: runner.os == 'Windows'
        working-directory: vscode-solx
        run: npm run test:package -- 1.85.2
      - name: Test packaged extension in VS Code 1.143.1
        if: runner.os == 'Windows'
        working-directory: vscode-solx
        run: npm run test:package -- 1.143.1
      - name: Test Windows installer validation and files
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./installer/windows/test.ps1
          & ./installer/windows/test-files.ps1
          & ./installer/windows/test-build.ps1
          & ./scripts/test-prepare-release.ps1
      - name: Build Windows bundle from validated source
        if: runner.os == 'Windows'
        shell: powershell
        run: ./installer/windows/build.ps1
      - name: Test extracted bundle and isolated terminal installations
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $codeRoot = Join-Path $PWD 'vscode-solx/.test-artifacts/vscode/vscode-win32-x64-archive-1.85.2'
          & ./installer/windows/test-install.ps1 -CodeRoot $codeRoot -SkipBuild
      - name: Prepare verified public release assets
        if: runner.os == 'Windows' && inputs.prepare_release
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: ./scripts/prepare-release.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:SOURCE_COMMIT
      - name: Retain public release assets
        if: success() && runner.os == 'Windows' && inputs.prepare_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 14
          path: dist/release-assets/*
      - name: Retain Windows validation reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-validation
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
          path: |
            vscode-solx/.test-artifacts/host-*/results.json
            vscode-solx/.test-artifacts/host-*/package.json
            vscode-solx/.test-artifacts/host-*/*.log
            vscode-solx/.test-artifacts/package-validation.json
            installer/windows/.artifacts/terminal-*/*.log
            installer/windows/.artifacts/terminal-*/results.json
      - name: Retain tested Windows bundle
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/solx-*-windows-x64.zip
            dist/solx-*-windows-x64.zip.json
