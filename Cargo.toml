[package]
name = "solx"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "=3.5.2"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Console"] }
